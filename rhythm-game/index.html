<html>
	<head>
		<title>Rhythm Game</title>
		<style>
			body{
				background-color:#ffffff;
				text-align: center;
			}
			#game{
				width:600px;
				height:400px;
				border:2px solid #000000;
				background-color:#dedede;
				padding-left: 0;
				padding-right: 0;
				margin-left: auto;
				margin-right: auto;

				/* scale up pixels */
				image-rendering: -moz-crisp-edges;
		        image-rendering: -webkit-crisp-edges;
		        image-rendering: pixelated;
		        image-rendering: crisp-edges;
			}
            .gameIMG{
                display:none;
            }
			#stats{
				margin-top:10px;
			}

			#gameStats{
				display: flex;
				justify-content: space-between;
				margin-top:1em;
			}
			#gameStats p{
				margin: auto;
			}
		</style>
	</head>
	<body onload="init()">
		<!--<div id="debugBar"><p id="debug" style="color:white">...</p></div>-->
		<canvas id='game'>Browser does not support HTML5 canvas</canvas>

		
		<div id="stats">
			<div id='inputs'>
				<input type='file' name='song' accept='.mp3' id='songFile'>
				<button id='playBtn' onclick="playMusic()">Play Song</button>
				<button id='resetBtn' onclick="resetMusic()">Reset Song</button>
			</div>
			<audio id='audio'></audio>
			<div id="gameStats">
				<p id="level">Level: 0</p>
				<p id="good_jumps">Good Jumps: 0</p>
				<p id="hits">Hits: 0</p>	
			</div>
			<p id="debug">Settings: None</p>

			<input type='checkbox' id='invincible' onchange="player.invincible = this.checked;"> Invincible Mode<br>
			<input type="range" id="offsetMusic" min="0" max="1" step="0.01" value="0.23"> Music Offset<br>
			<input type="range" id="speed" min="1" max="10" step="1" value="2.75" onchange="OBS_SPEED = this.value;"> Speed
			
			
		</div>	
		
        <img src="assets/p5.png" class="gameIMG" id="playerDemoIMG"> 
        <img src="assets/star.png" class="gameIMG" id="starImg"> 
        <img src="assets/spike.png" class="gameIMG" id="spikeImg">	
        <img src="assets/vines.png" class="gameIMG" id="vineIMG"> 
        <img src="assets/water.png" class="gameIMG" id="waterImg">
        <img src="assets/player1.png" class="gameIMG" id="player1IMG">
        <img src="assets/player2.png" class="gameIMG" id="player2IMG">

		



		
		<script src="beat_code.js"></script>
		<script src="code.js"></script>
	</body>
</html>
