<html>
	<head>
		<title>Rhythm Game</title>
		<style>
			body{
				background-color:#ffffff;
				text-align: center;
			}
			#game{
				width:600px;
				height:400px;
				border:2px solid #000000;
				background-color:#dedede;
				padding-left: 0;
				padding-right: 0;
				margin-left: auto;
				margin-right: auto;

				/* scale up pixels */
				image-rendering: -moz-crisp-edges;
		        image-rendering: -webkit-crisp-edges;
		        image-rendering: pixelated;
		        image-rendering: crisp-edges;
			}
            .gameIMG{
                display:none;
            }
		</style>
	</head>
	<body onload="init()">
		<!--<div id="debugBar"><p id="debug" style="color:white">...</p></div>-->
		<canvas id='game'>Browser does not support HTML5 canvas</canvas>
		<script src="code.js"></script>
        <img src="assets/p5.png" class="gameIMG" id="playerDemoIMG"> 
        <img src="assets/star.png" class="gameIMG" id="starImg"> 
        <img src="assets/spike.png" class="gameIMG" id="spikeImg">	
        <img src="assets/vines.png" class="gameIMG" id="vineIMG"> 
        <img src="assets/water.png" class="gameIMG" id="waterImg">
        <img src="assets/player1.png" class="gameIMG" id="player1IMG">
        <img src="assets/player2.png" class="gameIMG" id="player2IMG">
	</body>
</html>
