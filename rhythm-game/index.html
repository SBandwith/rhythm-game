<html>
	<head>
		<title>Rhythm Game</title>
		<style>
			body{
				background-color:#ffffff;
				text-align: center;
			}
			#game{
				width:600px;
				height:400px;
				border:2px solid #000000;
				background-color:#dedede;
				padding-left: 0;
				padding-right: 0;
				margin-left: auto;
				margin-right: auto;

				/* scale up pixels */
				image-rendering: -moz-crisp-edges;
		        image-rendering: -webkit-crisp-edges;
		        image-rendering: pixelated;
		        image-rendering: crisp-edges;
			}
            .gameIMG{
                display:none;
            }
			#stats{
				margin-top:10px;
			}

			#gameStats{
				display: flex;
				justify-content: space-between;
				margin:1em auto;
				width:30%;
			}
			#gameStats p{
				margin: auto;
			}
			#settings{
				width: 320px;
				margin: 1.5em auto;
				padding: 1em 1.25em;
				border: 1px solid #ccc;
				border-radius: 8px;
				background: #f7f7f7;
				text-align: left;
				font-family: sans-serif;
				font-size: 14px;
			}
			#settings h3{
				margin: 0 0 0.75em;
				font-size: 16px;
			}
			#settings .setting{
				margin: 0.9em 0;
			}
			#settings .setting label{
				display: flex;
				justify-content: space-between;
				margin-bottom: 0.3em;
			}
			#settings .value{
				font-family: monospace;
				font-weight: bold;
			}
			#settings input[type="range"]{
				width: 100%;
				margin: 0;
			}
			#settings .row{
				display: flex;
				gap: 1em;
			}
			#settings .row .setting{
				flex: 1;
			}
			#settings input[type="number"]{
				width: 100%;
				box-sizing: border-box;
			}
			#settings .checkbox label{
				display: flex;
				align-items: center;
				gap: 0.5em;
				justify-content: flex-start;
			}
		</style>
	</head>

	<body onload="init()">
		<!--<div id="debugBar"><p id="debug" style="color:white">...</p></div>-->
		<canvas id='game'>Browser does not support HTML5 canvas</canvas>

		
		<div id="stats">
			<div>
				<select id="songSelect" onchange="loadSong(this.value)">
					<option value="">Select a song</option>
					<!-- TODO: add songs from songlist.json -->
				</select>
				<button id="playBtn2" onclick="playSong()">Play Song</button>
				<button id="resetBtn2" onclick="resetMusic()">Reset Song</button>
			</div>
			<!-- <div id='inputs'>
				<input type='file' name='song' accept='.mp3' id='songFile'>
				<button id='playBtn' onclick="playMusic()">Play Song</button>
				<button id='resetBtn' onclick="resetMusic()">Reset Song</button>
			</div> -->
			<audio id='audio'></audio>
			<div id="gameStats">
				<p id="level">Level: 0</p>
				<p id="good_jumps">Good Jumps: 0</p>
				<p id="hits">Hits: 0</p>	
			</div>
			<p id="debug">Debug: None</p>

			<div id="settings">
				<h3>Settings</h3>
				<div class="setting checkbox">
					<label><input type="checkbox" id="invincible" onchange="player.invincible = this.checked;" checked> Invincible Mode</label>
				</div>
				<div class="setting">
					<label for="offsetMusic">Timing Calibration <span class="value" id="offsetMusicValue">0.00s</span></label>
					<input type="range" id="offsetMusic" min="-0.5" max="0.5" step="0.01" value="0">
				</div>
				<div class="setting">
					<label for="speed">Obstacle Speed <span class="value" id="speedValue">4</span></label>
					<input type="range" id="speed" min="1" max="10" step="1" value="4" oninput="OBS_SPEED = Number(this.value);">
				</div>
				<div class="setting">
					<label for="bpm">BPM <span class="value" id="bpmValue">80</span></label>
					<input type="range" id="bpm" min="40" max="200" step="0.01" value="80" oninput="SONG_BPM = Number(this.value); ALL_OBSTACLES = []; resyncBeatSchedule();">
				</div>
				<div class="row">
					<div class="setting">
						<label for="jumpHeight">Jump Height (px)</label>
						<input type="number" id="jumpHeight" min="40" max="200" step="5" value="100" oninput="JUMP_HEIGHT = Number(this.value);">
					</div>
					<div class="setting">
						<label for="airBeats">Air Time (beats)</label>
						<input type="number" id="airBeats" min="0.25" max="1" step="0.05" value="0.75" oninput="AIR_BEATS = Number(this.value);">
					</div>
				</div>
			</div>
		</div>
		<script>
			// Show each slider's current value in its label
			var sliderFormats = {
				offsetMusic: function(v){ return Number(v).toFixed(2) + "s"; },
				speed: function(v){ return v; },
				bpm: function(v){ return Number(v).toFixed(2); }
			};
			function updateSliderLabel(id){
				var input = document.getElementById(id);
				document.getElementById(id + "Value").textContent = sliderFormats[id](input.value);
			}
			Object.keys(sliderFormats).forEach(function(id){
				document.getElementById(id).addEventListener("input", function(){ updateSliderLabel(id); });
				updateSliderLabel(id);
			});
		</script>
		
        <img src="assets/imgs/p5.png" class="gameIMG" id="playerDemoIMG"> 
        <img src="assets/imgs/star.png" class="gameIMG" id="starImg"> 
        <img src="assets/imgs/spike.png" class="gameIMG" id="spikeImg">	
        <img src="assets/imgs/vines.png" class="gameIMG" id="vineIMG"> 
        <img src="assets/imgs/water.png" class="gameIMG" id="waterImg">
        <img src="assets/imgs/player1.png" class="gameIMG" id="player1IMG">
        <img src="assets/imgs/player2.png" class="gameIMG" id="player2IMG">

		



		
		<script src="beat_code.js"></script>
		<script src="code.js"></script>
	</body>
</html>
